name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: applybot
          POSTGRES_PASSWORD: applybot
          POSTGRES_DB: applybot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applybot -d applybot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Secret de test, jamais utilisé ailleurs qu'en CI (≥ 32 caractères, imposé par lib/auth/session.ts).
      JWT_SECRET: test-secret-for-ci-not-a-real-secret-00000
      TRUSTED_PROXY_HOPS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Suite de tests sur Postgres réel (le pilote de production, lib/db/client.ts branche
      # drizzle-orm/node-postgres quand DATABASE_URL commence par postgres://).
      #
      # --no-file-parallelism : chaque fichier de test qui touche la base (tests/setup-db.ts,
      # resetDatabase) fait `drop schema public cascade` puis remigre avant ses propres tests. Avec
      # Postgres, cette base est un service PARTAGÉ entre tous les fichiers de test du job : les
      # exécuter en parallèle les ferait courir les uns sur les autres (un fichier droppe le schéma
      # pendant qu'un autre est en plein test) — pas juste plus lent, réellement incorrect. Avec
      # PGlite (ci-dessous), chaque processus de test ouvre sa propre base en mémoire
      # (DATABASE_URL=pglite://memory) : l'isolation est automatique, mais on garde le même
      # flag par cohérence et parce que ça a aussi éliminé des timeouts de hook observés en local
      # sous forte contention (nombreuses instances PGlite lancées en même temps).
      - name: Tests (Postgres)
        run: npx vitest run --no-file-parallelism
        env:
          DATABASE_URL: postgres://applybot:applybot@localhost:5432/applybot

      # Même suite sur PGlite (le pilote par défaut en dev et dans .env.example), pour exercer les
      # deux branches de lib/db/client.ts.
      - name: Tests (PGlite)
        run: npx vitest run --no-file-parallelism
        env:
          DATABASE_URL: pglite://memory

      # DATABASE_URL et JWT_SECRET sont nécessaires même ici : lib/db/client.ts et lib/auth/session.ts
      # lisent process.env dès l'import (effet de bord au chargement du module, pas seulement à l'appel),
      # et Next.js importe les modules de toutes les routes API pendant le build (phase « Collecting page
      # data ») pour les analyser — sans ces variables `npm run build` échoue (vérifié en local : retrait
      # de DATABASE_URL/JWT_SECRET fait échouer le build avec « DATABASE_URL manquante »). On utilise ici
      # l'URL Postgres du service (pas pglite://memory comme pour les tests) : constaté en local que
      # pglite://memory pendant le build fait remonter des erreurs Turbopack sans gravité mais bruyantes
      # (résolution du chemin du binaire wasm de PGlite pendant le traçage des assets) ; aucune requête
      # n'est réellement exécutée à cette étape (open() ne fait que construire un `Pool` `pg`, sans
      # connexion immédiate), donc l'URL n'a pas besoin d'être joignable au sens strict — elle l'est de
      # toute façon ici, le service `postgres` tourne pendant tout le job.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://applybot:applybot@localhost:5432/applybot

      # Garde 1 : aucun fichier .env (autre que .env.example) ne doit jamais être commité.
      - name: Garde — pas de .env commité
        run: |
          ! git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'

      # Garde 2 : aucune trace d'IA (OpenAI) ou de Supabase (l'ancienne stack B2C) dans le code
      # applicatif — ApplyBot v2 est un SaaS B2B sans IA, Postgres + auth maison.
      #
      # Le périmètre couvre aussi scripts/, proxy.ts et drizzle/ : les scripts de maintenance
      # tournent avec les mêmes accès que l'appli, proxy.ts voit passer chaque requête, et une
      # migration est du code exécuté en production. Une garde qui s'arrête à app/lib/components
      # laisse trois portes ouvertes sur quatre.
      - name: Garde — pas d'IA ni de Supabase dans le code
        run: |
          ! grep -rniE "openai|supabase|sk-[a-z0-9]{20}" app lib components scripts proxy.ts drizzle

  # Job séparé : construit l'image Docker ET la fait vraiment tourner (conteneur Postgres +
  # conteneur applybot, healthcheck HTTP, en-têtes de sécurité, script de maintenance exécuté dans
  # l'image) pour détecter tôt une régression du Dockerfile (étape de build cassée, fichier copié
  # manquant, migration qui ne se lance pas...). Ce n'est PAS le déploiement — Coolify reconstruit et
  # déploie l'image lui-même depuis le dépôt (voir deploy/coolify.md) ; ce job vérifie seulement que
  # l'image se construit ET démarre correctement, dans un job distinct pour qu'un échec soit visible
  # séparément des `checks` applicatifs.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: applybot:ci

      # Fait tourner l'image pour de vrai : conteneur Postgres + conteneur applybot sur le même
      # réseau Docker, attend que /login réponde (migration + démarrage du serveur inclus), vérifie
      # les en-têtes de sécurité posés par next.config.ts, puis exécute scripts/purge-inactive.ts
      # DANS le conteneur pour prouver que scripts/ + lib/ (imports relatifs ET alias "@/") se
      # résolvent bien avec le node_modules et le tsconfig.json embarqués dans l'image — c'est
      # exactement le genre de trou que `docker build` seul ne peut pas détecter (il compile
      # server.js, mais scripts/migrate.ts n'est jamais exécuté pendant le build).
      - name: docker run — smoke test (Postgres + healthcheck + scripts)
        run: |
          set -e
          docker network create applybot-ci

          docker run -d --name applybot-ci-db --network applybot-ci \
            -e POSTGRES_USER=applybot -e POSTGRES_PASSWORD=applybot -e POSTGRES_DB=applybot \
            postgres:16

          echo "Attente de Postgres..."
          for i in $(seq 1 30); do
            if docker exec applybot-ci-db pg_isready -U applybot -d applybot >/dev/null 2>&1; then
              echo "Postgres prêt."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Postgres jamais prêt après 60s." >&2
              docker logs applybot-ci-db
              exit 1
            fi
            sleep 2
          done

          docker run -d --name applybot-ci-app --network applybot-ci \
            -e DATABASE_URL=postgres://applybot:applybot@applybot-ci-db:5432/applybot \
            -e JWT_SECRET=test-secret-for-ci-not-a-real-secret-00000 \
            -e TRUSTED_PROXY_HOPS=1 \
            -e NODE_ENV=production \
            -p 3000:3000 \
            applybot:ci

          echo "Attente du serveur (migration + démarrage)..."
          ready=""
          for i in $(seq 1 30); do
            if headers=$(curl -fsSI http://localhost:3000/login 2>/dev/null); then
              echo "Serveur prêt."
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "Le serveur n'a jamais répondu sur /login après 60s." >&2
            docker logs applybot-ci-app
            exit 1
          fi

          echo "$headers"
          normalized=$(printf '%s' "$headers" | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          echo "$normalized" | grep -qE '^x-frame-options: deny$' || {
            echo "En-tête X-Frame-Options: DENY absent." >&2
            docker logs applybot-ci-app
            exit 1
          }
          echo "$normalized" | grep -qE '^x-content-type-options: nosniff$' || {
            echo "En-tête X-Content-Type-Options: nosniff absent." >&2
            docker logs applybot-ci-app
            exit 1
          }
          echo "En-têtes de sécurité confirmés."

          echo "Exécution de scripts/purge-inactive.ts dans le conteneur (preuve que lib/ et l'alias @/ se résolvent)..."
          docker exec applybot-ci-app node node_modules/tsx/dist/cli.mjs scripts/purge-inactive.ts || {
            echo "scripts/purge-inactive.ts a échoué dans le conteneur." >&2
            docker logs applybot-ci-app
            exit 1
          }

          echo "Import d'un vrai PDF via l'API (preuve que pdf-parse fonctionne hors bundle : organisme + stagiaire créés via l'API)..."
          ORIGIN="-H origin:http://localhost:3000 -H host:localhost:3000"
          REG=$(curl -sS -c /tmp/ci-cookies -H content-type:application/json $ORIGIN             -d '{"organisationName":"CI OF","email":"ci-resp@example.test","password":"ci-mot-de-passe-2026","acceptedTerms":true}'             -w '\nHTTP %{http_code}' http://localhost:3000/api/auth/register-organisation)
          echo "$REG" | grep -q 'HTTP 201' || { echo "register-organisation a échoué : $REG" >&2; docker logs applybot-ci-app; exit 1; }
          CODE=$(docker exec applybot-ci-db psql -U applybot -d applybot -tAc "update organisations set active=true, seats=5 where name='CI OF' returning code")
          REG2=$(curl -sS -c /tmp/ci-cookies -H content-type:application/json $ORIGIN             -d "{\"email\":\"ci-stagiaire@example.test\",\"password\":\"ci-mot-de-passe-2026\",\"orgCode\":\"$CODE\",\"acceptedTerms\":true}"             -w '\nHTTP %{http_code}' http://localhost:3000/api/auth/register)
          echo "$REG2" | grep -q 'HTTP 201' || { echo "register (code=$CODE) a échoué : $REG2" >&2; docker logs applybot-ci-app; exit 1; }
          IMPORT=$(curl -sS -b /tmp/ci-cookies $ORIGIN -F "cv=@tests/fixtures/cv-minimal.pdf;type=application/pdf" http://localhost:3000/api/import-cv)
          echo "$IMPORT" | grep -q '"ok":true' || {
            echo "L'import PDF a échoué : $IMPORT" >&2
            docker logs applybot-ci-app
            exit 1
          }
          echo "Import PDF confirmé."

          echo "Smoke test OK."

      - name: Nettoyage des conteneurs
        if: always()
        run: |
          docker logs applybot-ci-app 2>&1 | tail -100 || true
          docker rm -f applybot-ci-app applybot-ci-db 2>/dev/null || true
          docker network rm applybot-ci 2>/dev/null || true
